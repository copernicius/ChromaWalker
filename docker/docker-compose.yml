services:
  mongodb:
    image: mongo:7.0
    container_name: mern-mongodb
    ports:
      - "27017:27017"
    volumes:
      - ./data/db:/data/db

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: mern-server
    volumes:
      - ../server:/app/server
      - /app/server/node_modules 
    working_dir: /app/server
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    depends_on:
      - mongodb  # Make sure the server starts after MongoDB is ready

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: mern-client
    tty: true
    stdin_open: true
    volumes:
      - ../client:/app/client:cached
      - /app/client/node_modules
    working_dir: /app/client
    # PROXY_TARGET tells vite.config.ts where to forward /api + /socket.io.
    # Inside the docker network the server is reachable as `server:3000`;
    # localhost:3000 from this container points at the client itself.
    environment:
      - PROXY_TARGET=http://server:3000
    command: sh -c "pnpm install && pnpm run dev"
    ports:
      - "5173:5173"
    depends_on:
      - server