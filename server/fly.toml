# fly.toml app configuration file generated for chromawalk-server on 2026-05-04T11:29:12+12:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'chromawalk-server'
primary_region = 'syd'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'

# Uploads now go to Cloudflare R2 (see server/src/lib/storage.ts), so the
# old persistent volume is no longer needed. After a successful deploy,
# free the storage with: fly volumes destroy uploads

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
